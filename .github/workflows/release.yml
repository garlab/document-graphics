# Push a version tag such as v0.1.1, on a commit in `main` whose Cargo.toml has
# that version, to publish it on crates.io. Publishing uses crates.io's Trusted
# Publishing for this workflow and the `release` environment: no stored token.
name: Release

on:
  push:
    tags: ['v*']

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

env:
  TAG: ${{ github.ref_name }}

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable
      - name: Check that the tag matches Cargo.toml and is on main
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "document-graphics") | .version')
          if [ "$TAG" != "v$version" ]; then
            echo "::error::$TAG doesn't match version $version in Cargo.toml"
            exit 1
          fi
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::$TAG isn't on main: push main, then re-run this workflow"
            exit 1
          fi
      - run: cargo test --no-default-features --lib --locked
      - run: cargo test --no-default-features --features images --lib --locked
      - run: cargo test --no-default-features --features image-worker --lib --test images --locked
      - run: cargo test --all-features --locked
      - run: cargo publish -p document-graphics --all-features --dry-run --locked

  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth
      # `--no-verify`: `verify` built the package from this commit, and
      # building it again here would run the dependencies' build scripts and
      # macros while the token is in the environment.
      - name: Publish, unless this version is on crates.io already
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          if curl -sfo /dev/null -A "document-graphics release (github.com/garlab/document-graphics)" \
            "https://crates.io/api/v1/crates/document-graphics/${TAG#v}"; then
            echo "document-graphics ${TAG#v} is on crates.io already"
          else
            cargo publish -p document-graphics --locked --no-verify
          fi
