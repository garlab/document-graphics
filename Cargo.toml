[workspace]
resolver = "3"

[package]
name = "document-graphics"
version = "0.1.4"
edition = "2024"
rust-version = "1.90"
description = "Render graphics from untrusted documents to RGBA, with resource limits and isolated workers."
license = "MIT"
readme = "README.md"
documentation = "https://docs.rs/document-graphics"
repository = "https://github.com/garlab/document-graphics"
keywords = ["mermaid", "svg", "preview", "rendering"]
categories = ["rendering", "text-processing"]
include = ["src/**", "tests/**", "fonts/**", "README.md", "LICENSE", "Cargo.toml"]

[features]
default = []
sgf = []
chess = ["dep:cozy-chess"]

[dependencies]
cozy-chess = { version = "0.3.4", optional = true }
katex-native = "0.1"
mermaid-rs-renderer = { package = "document-graphics-mermaid", version = "=0.1.3", default-features = false }
resvg = { version = "0.45.1", default-features = false, features = ["text"] }
roxmltree = "0.20"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"

[[test]]
name = "worker"
harness = false
